name: Multi GCC
on:
  workflow_dispatch:
  push:
    branches:
    - master
    - test_workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  riscv-flags:
    if: github.repository_owner == 'raspberrypi'
    runs-on:
    - self-hosted
    - Linux
    - X64
    steps:
    - name: Clean workspace
      run: |
        echo "Cleaning up previous run"
        rm -rf "${{ github.workspace }}"
        mkdir -p "${{ github.workspace }}"
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Check RISCV GCC 16.1.0 gives cpu=hazard3-rp2350
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        cd ${{ github.workspace }} && rm -rf build && cmake -S . -B build -DPICO_NO_PICOTOOL=1 -DPICO_PLATFORM=rp2350-riscv -DPICO_TOOLCHAIN_PATH=/opt/riscv/gcc-riscv-32-pico-elf-16.1.0
        grep "CMAKE_ASM_FLAGS" build/CMakeCache.txt && grep "cpu=hazard3-rp2350" build/CMakeCache.txt
    - name: Check RISCV GCC 15.1.0 gives arch=rv32ima_zicsr_zifencei_zba_zbb_zbs_zbkb_zca_zcb_zcmp
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        cd ${{ github.workspace }} && rm -rf build && cmake -S . -B build -DPICO_NO_PICOTOOL=1 -DPICO_PLATFORM=rp2350-riscv -DPICO_TOOLCHAIN_PATH=/opt/riscv/riscv32-unknown-elf-gcc-15.1.0
        grep "CMAKE_ASM_FLAGS" build/CMakeCache.txt && grep "arch=rv32ima_zicsr_zifencei_zba_zbb_zbs_zbkb_zca_zcb_zcmp" build/CMakeCache.txt
    - name: Check RISCV GCC 14.1.0 gives arch=rv32imac_zicsr_zifencei_zba_zbb_zbs_zbkb
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        cd ${{ github.workspace }} && rm -rf build && cmake -S . -B build -DPICO_NO_PICOTOOL=1 -DPICO_PLATFORM=rp2350-riscv -DPICO_TOOLCHAIN_PATH=/opt/riscv/riscv32-unknown-elf-gcc-14.1.0
        grep "CMAKE_ASM_FLAGS" build/CMakeCache.txt && grep "arch=rv32imac_zicsr_zifencei_zba_zbb_zbs_zbkb" build/CMakeCache.txt
    - name: Check RISCV GCC 12.1.0 gives arch=rv32imac_zicsr_zifencei_zba_zbb_zbs_zbkb
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        cd ${{ github.workspace }} && rm -rf build && cmake -S . -B build -DPICO_NO_PICOTOOL=1 -DPICO_PLATFORM=rp2350-riscv -DPICO_TOOLCHAIN_PATH=/opt/riscv/riscv32-unknown-elf-gcc-12.1.0
        grep "CMAKE_ASM_FLAGS" build/CMakeCache.txt && grep "arch=rv32imac_zicsr_zifencei_zba_zbb_zbs_zbkb" build/CMakeCache.txt
  quick:
    if: github.repository_owner == 'raspberrypi'
    runs-on:
    - self-hosted
    - Linux
    - X64
    steps:
    - name: Clean workspace
      run: |-
        echo "Cleaning up previous run"
        rm -rf "${{ github.workspace }}"
        mkdir -p "${{ github.workspace }}"
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init
    - name: Build
      run: python3 .github/workflows/scripts/multi_gcc_build.py quick
  exhaustive:
    if: github.repository_owner == 'raspberrypi'
    runs-on:
    - self-hosted
    - Linux
    - X64
    needs: [quick, riscv-flags]
    steps:
    - name: Clean workspace
      run: |-
        echo "Cleaning up previous run"
        rm -rf "${{ github.workspace }}"
        mkdir -p "${{ github.workspace }}"
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init
    - name: Build
      run: python3 .github/workflows/scripts/multi_gcc_build.py exhaustive
