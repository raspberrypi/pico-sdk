name: Multi GCC
on:
  workflow_dispatch:
  push:
    branches:
    - master
    - test_workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quick:
    if: github.repository_owner == 'raspberrypi'
    runs-on:
    - self-hosted
    - Linux
    - X64
    steps:
    - name: Clean workspace
      run: |-
        echo "Cleaning up previous run"
        rm -rf "${{ github.workspace }}"
        mkdir -p "${{ github.workspace }}"
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init
    - name: Build
      run: python3 .github/workflows/scripts/multi_gcc_build.py quick
  exhaustive:
    if: github.repository_owner == 'raspberrypi'
    runs-on:
    - self-hosted
    - Linux
    - X64
    needs: quick
    steps:
    - name: Clean workspace
      run: |-
        echo "Cleaning up previous run"
        rm -rf "${{ github.workspace }}"
        mkdir -p "${{ github.workspace }}"
    - name: Checkout repo
      uses: actions/checkout@v4
    - name: Checkout submodules
      run: git submodule update --init
    - name: Build
      run: python3 .github/workflows/scripts/multi_gcc_build.py exhaustive
